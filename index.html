    <style>
        /* Estilos actualizados para las tarjetas de regiones con imágenes reales */
        .regions-grid-visual {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
            gap: 1.5rem;
            margin-top: 2rem;
        }

        .region-card {
            height: 180px;
            border-radius: 14px;
            position: relative;
            overflow: hidden;
            text-decoration: none;
            display: flex;
            align-items: flex-end;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            transition: var(--transition);
            padding: 1.25rem 1.5rem;
            justify-content: space-between;
            background-size: cover;
            background-position: center;
        }

        /* Capa oscura superpuesta para asegurar legibilidad del texto */
        .region-card::before {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(180deg, rgba(0,0,0,0.1) 0%, rgba(0,0,0,0.75) 100%);
            z-index: 1;
            transition: var(--transition);
        }

        /* Imágenes de fondo representativas optimizadas */
        .region-caba { background-image: url('https://images.pexels.com/photos/338515/pexels-photo-338515.jpeg?auto=compress&cs=tinysrgb&w=600'); }
        .region-cordoba { background-image: url('https://images.pexels.com/photos/1654698/pexels-photo-1654698.jpeg?auto=compress&cs=tinysrgb&w=600'); }
        .region-rosario { background-image: url('https://images.pexels.com/photos/1591373/pexels-photo-1591373.jpeg?auto=compress&cs=tinysrgb&w=600'); }
        .region-mendoza { background-image: url('https://images.pexels.com/photos/1367192/pexels-photo-1367192.jpeg?auto=compress&cs=tinysrgb&w=600'); }
        .region-ushuaia { background-image: url('https://images.pexels.com/photos/167699/pexels-photo-167699.jpeg?auto=compress&cs=tinysrgb&w=600'); }
        .region-iguazu { background-image: url('https://images.pexels.com/photos/2474661/pexels-photo-2474661.jpeg?auto=compress&cs=tinysrgb&w=600'); }
        .region-posadas { background-image: url('https://images.pexels.com/photos/2387793/pexels-photo-2387793.jpeg?auto=compress&cs=tinysrgb&w=600'); }

        .region-card h3 {
            color: var(--white);
            font-size: 1.15rem;
            font-weight: 700;
            text-shadow: 0 2px 4px rgba(0,0,0,0.5);
            z-index: 2;
        }

        .region-arrow {
            color: var(--white);
            background-color: rgba(255, 255, 255, 0.25);
            backdrop-filter: blur(4px);
            width: 32px; height: 32px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 800;
            transition: var(--transition);
            flex-shrink: 0;
            z-index: 2;
        }

        .region-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 12px 30px rgba(0,0,0,0.25);
        }

        .region-card:hover::before {
            background: linear-gradient(180deg, rgba(0,0,0,0) 0%, rgba(0,0,0,0.6) 100%);
        }

        .region-card:hover .region-arrow {
            background-color: var(--white);
            color: var(--primary);
            transform: translateX(4px);
        }
    </style>
